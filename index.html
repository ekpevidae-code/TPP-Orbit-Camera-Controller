<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="stylesheet" href="./src/style.scss" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Open World Action Game</title>
  </head>
  <body>
    <div id="progress"><div id="bar"></div></div>
    <button id="rotate-screen-btn" type="button">ROTATE TO LANDSCAPE</button>

    <div id="mini-map-wrap" aria-label="Nearby radar">
      <canvas id="mini-map" width="144" height="144"></canvas>
      <span class="radar-label">CITY RADAR</span>
    </div>
    <button id="pause-btn" type="button" aria-label="Pause game">Ⅱ</button>
    <div id="pause-menu" aria-hidden="true">
      <div class="pause-card">
        <div class="pause-kicker">OPEN WORLD</div>
        <h2>PAUSED</h2>
        <p>Your game is waiting.</p>
        <button id="resume-btn" type="button">RESUME GAME</button>
      </div>
    </div>
    <!-- Camera Mode Toggle -->
    <div id="camera-controls">
      <div class="camera-mode-selector">
        <button id="tpp-mode-btn" class="mode-btn active" data-mode="tpp">
          <span class="mode-icon">👤</span>
          <span class="mode-label">TPP</span>
        </button>
        <button id="orbit-mode-btn" class="mode-btn" data-mode="orbit">
          <span class="mode-icon">🔄</span>
          <span class="mode-label">Orbit</span>
        </button>
      </div>
    </div>

    <!-- Mobile Controls -->
    <div id="mobile-controls">
      <!-- Virtual Joystick -->
      <div id="virtual-joystick" class="joystick-container">
        <div class="joystick-base">
          <div class="joystick-knob" id="joystick-knob"></div>
        </div>
      </div>

      <!-- Fallback WASD Controls (can be hidden) -->
      <div id="movement-pad" class="fallback-controls">
        <button class="control-btn" id="btn-w" data-key="KeyW">W</button>
        <div class="control-row">
          <button class="control-btn" id="btn-a" data-key="KeyA">A</button>
          <button class="control-btn" id="btn-s" data-key="KeyS">S</button>
          <button class="control-btn" id="btn-d" data-key="KeyD">D</button>
        </div>

        <button class="control-btn space-btn" id="btn-space" data-key="Space">
          JUMP (SPACE)
        </button>
        <button
          class="control-btn sprint-btn"
          id="btn-sprint"
          data-key="ShiftLeft"
        >
          SPRINT (SHIFT)
        </button>
      </div>
    </div>

    <div id="wanted-level" class="wanted-level">WANTED  ☆☆☆☆☆</div>
    <button id="crime-btn" class="crime-btn" type="button">COMMIT CRIME</button>
    <div id="aim-reticle" class="aim-reticle" aria-hidden="true"><span></span></div>
    <div id="ammo-hud" class="ammo-hud">PISTOL 12 / 60</div>
    <button id="jump-btn" class="hud-action jump-btn" type="button">JUMP</button>
    <button id="gas-btn" class="hud-action gas-btn" type="button">GAS</button>
    <button id="brake-btn" class="hud-action brake-btn" type="button">BRAKE</button>
    <button id="fire-btn" class="combat-btn fire-btn" type="button">FIRE</button>
    <button id="reload-btn" class="combat-btn reload-btn" type="button">RELOAD</button>
    <button id="run-btn" class="run-btn" type="button">RUN</button>
    <button id="vehicle-btn" class="vehicle-btn" type="button">ENTER CAR</button>

    <canvas id="three"></canvas>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>

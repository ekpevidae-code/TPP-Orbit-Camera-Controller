<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#080c12" />
    <meta name="description" content="Velocity Run — high-speed arcade racing." />
    <title>VELOCITY RUN</title>
  </head>
  <body>
    <div id="game-root">
      <canvas id="game-canvas" aria-label="Velocity Run 3D racing game"></canvas>
      <div id="boot-screen"><div class="boot-mark">VR</div><div class="boot-title">VELOCITY RUN</div><div class="boot-sub">INITIALIZING RACE SYSTEMS</div><div class="boot-track"><i></i></div></div>
      <div id="error-screen" hidden></div>
      <header class="top-hud">
        <div class="brand"><b>VELOCITY</b><span>RUN / TEST DRIVE</span></div>
        <div class="race-readout"><span class="readout-label">SPEED</span><strong id="speed">000</strong><small>KM/H</small></div>
        <button id="debug-toggle" class="micro-button" aria-label="Toggle diagnostics">DBG</button>
      </header>
      <section class="nitro-wrap">
        <div class="nitro-head"><span id="boost-label">NITRO SYSTEM</span><span id="nitro-percent">000%</span></div>
        <div class="nitro-bar"><i id="nitro-fill"></i><b id="perfect-marker"></b><span id="perfect-label">PERFECT</span></div>
      </section>
      <div id="drift-score" class="drift-score"></div>
      <div id="boost-flash" class="boost-flash"></div>
      <div class="control-mode"><button id="mode-touch" class="mode-choice active">TOUCHDRIVE</button><button id="mode-manual" class="mode-choice">MANUAL</button></div>
      <div class="touch-controls">
        <div class="steer-pad"><button id="steer-left" class="steer-button">‹</button><button id="steer-right" class="steer-button">›</button></div>
        <div class="action-pad"><button id="drift-button" class="action-button drift-button">DRIFT</button><button id="nitro-button" class="action-button nitro-button"><span>NITRO</span><b>BOOST</b></button><button id="brake-button" class="action-button brake-button">BRAKE</button><button id="gas-button" class="action-button gas-button">GAS</button></div>
      </div>
      <aside id="debug-panel" class="debug-panel" hidden>
        <div class="debug-title">LIVE TELEMETRY <button id="debug-close">×</button></div>
        <div class="debug-grid">
          <span>FPS <b id="debug-fps">--</b></span><span>SPEED <b id="debug-speed">--</b></span>
          <span>SLIP ANGLE <b id="debug-slip">--</b></span><span>DRIFT <b id="debug-drift">OFF</b></span>
          <span>NITRO <b id="debug-nitro">--</b></span><span>QUALITY <b id="debug-quality">--</b></span>
        </div>
        <div class="debug-errors"><b>RUNTIME ERRORS</b><pre id="debug-errors">None</pre></div>
        <div class="debug-hint">Tap DBG to hide · Hold DRIFT while steering</div>
      </aside>
      <footer class="bottom-hud"><span>TEST CIRCUIT 01</span><span id="drive-state">TOUCHDRIVE ACTIVE</span><span>BUILD M1</span></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

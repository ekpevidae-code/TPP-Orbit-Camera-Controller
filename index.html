<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#090e18" />
  <title>Velocity Run — 3D Racing</title>
  <link rel="stylesheet" href="/src/racing.css" />
</head>
<body>
  <main id="game">
    <canvas id="race-canvas" aria-label="3D racing game"></canvas>
    <div class="topbar">
      <div class="brand"><span class="brand-mark">V</span><span>VELOCITY <b>RUN</b></span></div>
      <div class="race-status"><span class="live-dot"></span><span id="race-state">READY TO RACE</span></div>
      <button id="pause" class="icon-btn" aria-label="Pause">Ⅱ</button>
    </div>
    <section class="hud" aria-live="polite">
      <div class="speed-box"><div class="eyebrow">SPEED</div><div class="speed-line"><strong id="speed">000</strong><span>KM/H</span></div></div>
      <div class="race-box"><div class="eyebrow">DISTANCE</div><strong id="distance">0.0 <small>KM</small></strong><div class="progress-track"><i id="progress"></i></div></div>
      <div class="position-box"><div class="eyebrow">POSITION</div><strong id="position">1<span>ST</span></strong></div>
    </section>
    <div class="drift-toast" id="drift-toast"><span>DRIFT SCORE</span><strong id="drift-score">0</strong><small>KEEP SLIDING</small></div>
    <div class="center-message" id="message"><strong>READY?</strong><span>Tap RACE to start your run</span></div>
    <div class="bottom-hud">
      <div class="steering">
        <button class="control steer" id="left" aria-label="Steer left">‹</button>
        <button class="control steer" id="right" aria-label="Steer right">›</button>
      </div>
      <div class="actions">
        <button class="control brake" id="brake">BRAKE</button>
        <button class="control nitro" id="nitro"><span>⚡</span> NITRO</button>
        <button class="control gas" id="gas">RACE <span>›</span></button>
      </div>
    </div>
    <div class="footer-note"><span>TOUCH CONTROLS</span><span>WASD / ARROWS ALSO WORK</span></div>
    <div class="pause-layer hidden" id="pause-layer">
      <div class="pause-card"><div class="eyebrow">VELOCITY RUN</div><h1>PAUSED</h1><p>Your race is waiting.</p><button id="resume">RESUME RACE</button><button id="restart" class="secondary">RESTART</button></div>
    </div>
    <div class="finish-layer hidden" id="finish-layer">
      <div class="pause-card"><div class="eyebrow">RACE COMPLETE</div><h1 id="finish-title">FINISH!</h1><p id="finish-copy">Great driving.</p><button id="again">RACE AGAIN</button></div>
    </div>
  </main>
  <script type="module" src="/src/racing.js"></script>
</body>
</html>
